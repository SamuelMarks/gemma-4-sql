[tox]
requires = tox>=4.20, tox-uv>=1.11
envlist = core, pytorch, jax, keras, maxtext, mlx, coverage-report
isolated_build = true

[testenv]
runner = uv-venv-lock-runner
setenv =
    COVERAGE_FILE = {toxworkdir}/.coverage.{envname}
    KERAS_BACKEND = torch
commands =
    pytest --cov=src/gemma_4_sql --cov-branch --cov-report= --cov-fail-under=0 {posargs}

[testenv:core]
extras = dev,duckdb
commands =
    pytest --cov=src/gemma_4_sql/sdk --cov=src/gemma_4_sql/cli --cov=src/gemma_4_sql/utils --cov=src/gemma_4_sql/__init__.py --cov=src/gemma_4_sql/cli.py --cov=src/gemma_4_sql/cli_benchmark.py --cov=src/gemma_4_sql/cli_db.py --cov=src/gemma_4_sql/cli_etl.py --cov=src/gemma_4_sql/cli_misc.py --cov=src/gemma_4_sql/cli_serve.py --cov=src/gemma_4_sql/cli_train.py --cov=src/gemma_4_sql/constants.py --cov=src/gemma_4_sql/exceptions.py --cov=src/gemma_4_sql/tokenization.py --cov=src/gemma_4_sql/type_hints.py --cov=src/gemma_4_sql/cli_parsers --cov-branch --cov-report= --cov-fail-under=0 tests/core/ tests/sdk/ tests/cli/ tests/utils/

[testenv:pytorch]
extras = dev,pytorch
commands =
    pytest --cov=src/gemma_4_sql/backends/pytorch --cov-branch --cov-report= --cov-fail-under=0 tests/backends/pytorch/

[testenv:jax]
extras = dev,jax
commands =
    pytest --cov=src/gemma_4_sql/backends/jax --cov-branch --cov-report= --cov-fail-under=0 tests/backends/jax/

[testenv:keras]
extras = dev,keras
commands =
    pytest --cov=src/gemma_4_sql/backends/keras --cov-branch --cov-report= --cov-fail-under=0 tests/backends/keras/

[testenv:maxtext]
extras = dev,maxtext
commands =
    pytest --cov=src/gemma_4_sql/backends/maxtext --cov-branch --cov-report= --cov-fail-under=0 tests/backends/maxtext/

[testenv:mlx]
platform = darwin
extras = dev,mlx
commands =
    pytest --cov=src/gemma_4_sql/backends/mlx --cov-branch --cov-report= --cov-fail-under=0 tests/backends/mlx/

[testenv:coverage-report]
depends = core, pytorch, jax, keras, maxtext, mlx
runner = uv-venv-runner
skip_install = true
deps = coverage[toml]
setenv =
    COVERAGE_FILE = {toxworkdir}/.coverage
commands =
    coverage combine --keep {toxworkdir}
    coverage report --show-missing --fail-under=0
    coverage xml -o {toxinidir}/coverage.xml
    coverage html -d {toxinidir}/htmlcov
