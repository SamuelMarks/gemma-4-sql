repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format
  - repo: local
    hooks:
      - id: interrogate
        name: Check 100% docstring coverage
        entry: bash -c "uv run --extra dev interrogate -v src/gemma_4_sql tests scripts"
        language: system
        pass_filenames: false
        always_run: true
      - id: pyright
        name: Run strict pyright type checking
        entry: bash -c "uv run --extra dev pyright"
        language: system
        pass_filenames: false
        always_run: true
      - id: ty
        name: Run ty type checking
        entry: bash -c "uv run --extra dev ty check"
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest-cov
        name: Run pytest with 100% line and branch coverage
        entry: bash -c "uv run --extra dev --extra mlx pytest --cov=src/gemma_4_sql --cov=tests --cov=scripts --cov-branch --cov-report=term-missing --cov-fail-under=100"
        language: system
        pass_filenames: false
        always_run: true
      - id: update-badges
        name: Update doc and test coverage badges
        entry: bash -c "uv run --extra dev python scripts/update_badges.py"
        language: system
        pass_filenames: false
        always_run: true
