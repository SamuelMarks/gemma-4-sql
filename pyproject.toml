[build-system]
requires = [
    "hatchling",
    "hatch-requirements-txt",
]
build-backend = "hatchling.build"

[project]
name = "gemma-4-sql"
version = "0.0.1"
description = "Natural text to SQL with Gemma 4; with DuckDB support and swappable-backends: PyTorch; Keras ; JAX; JAX / MaxText "
readme = "README.md"
license = "Apache-2.0 OR MIT"
requires-python = ">=3.12"
dynamic = [
    "dependencies",
    "optional-dependencies",
]

[project.scripts]
gemma-4-sql = "gemma_4_sql.cli:cli"

[project.entry-points."gemma_4_sql.backends"]
jax = "gemma_4_sql.backends.jax"
keras = "gemma_4_sql.backends.keras"
maxtext = "gemma_4_sql.backends.maxtext"
pytorch = "gemma_4_sql.backends.pytorch"
pytorch_hf = "gemma_4_sql.backends.pytorch"
pytorch_native = "gemma_4_sql.backends.pytorch"
mlx = "gemma_4_sql.backends.mlx"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.metadata.hooks.requirements_txt]
files = [
    "requirements.txt",
]

[tool.hatch.metadata.hooks.requirements_txt.optional-dependencies]
dev = [
    "requirements-dev.txt",
]
jax = [
    "requirements-jax.txt",
]
keras = [
    "requirements-keras.txt",
]
maxtext = [
    "requirements-maxtext.txt",
]
pytorch = [
    "requirements-pytorch.txt",
]
duckdb = [
    "requirements-duckdb.txt",
]
mlx = [
    "requirements-mlx.txt",
]
all = [
    "requirements-jax.txt",
    "requirements-keras.txt",
    "requirements-maxtext.txt",
    "requirements-pytorch.txt",
    "requirements-duckdb.txt",
]
default = [
    "requirements-jax.txt",
    "requirements-keras.txt",
    "requirements-maxtext.txt",
    "requirements-pytorch.txt",
    "requirements-duckdb.txt",
]

[tool.pydocstyle]
convention = "pep257"
add_ignore = "D202"

[tool.ruff]
unsafe-fixes = true
preview = true
line-length = 320
target-version = "py39"

[tool.ruff.lint]
ignore = [
    "non-empty-init-module",
    "pytest-raises-ambiguous-pattern",
    "unused-unpacked-variable",
    "assert-raises-exception",
    "star-arg-unpacking-after-keyword-arg",
    "missing-trailing-comma",
    "single-line-implicit-string-concatenation",
    "too-many-statements",
    "non-pep604-annotation-union",
    "too-many-statements-in-try-clause",
    "float-equality-comparison",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "assert",
    "no-self-use",
    "unused-function-argument",
    "unused-method-argument",
    "unused-class-method-argument",
    "unused-async",
    "docstring-missing-exception",
    "docstring-missing-returns",
    "pytest-composite-assertion",
    "compare-to-empty-string",
    "too-many-statements-in-try-clause",
    "import-outside-top-level",
    "import-private-name",
    "too-many-locals",
    "too-many-statements-in-try-clause",
    "float-equality-comparison",
    "subclass-builtin",
    "multiple-with-statements",
    "mutable-class-default",
]
"src/**/tests/*" = [
    "assert",
    "no-self-use",
    "unused-function-argument",
    "unused-method-argument",
    "unused-class-method-argument",
    "unused-async",
    "docstring-missing-exception",
    "docstring-missing-returns",
    "pytest-composite-assertion",
    "compare-to-empty-string",
    "too-many-statements-in-try-clause",
    "import-outside-top-level",
    "import-private-name",
    "too-many-locals",
    "too-many-statements-in-try-clause",
    "float-equality-comparison",
    "subclass-builtin",
    "multiple-with-statements",
    "mutable-class-default",
]
select = [
    "ALL",
]
extend-unsafe-fixes = [
    "ALL",
]
extend-safe-fixes = [
    "ALL",
]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.isort]
known-first-party = [
    "gemma_4_sql",
]

[tool.mypy]
python_version = "3.12"
ignore_errors = false
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
allow_redefinition = true
disallow_any_generics = true
disallow_subclassing_any = false
disallow_untyped_decorators = false
warn_return_any = false

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "gemma_4_sql.backends.jax.gemma4.tests.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = "gemma_4_sql.*"
disallow_subclassing_any = false
disallow_untyped_decorators = false
warn_return_any = false

[tool.coverage.run]

[tool.coverage.report]

[tool.pytest.ini_options]
addopts = "--cov=src/gemma_4_sql --cov-report=term-missing --cov-fail-under=100 --cov-branch"
filterwarnings = [
    "ignore::FutureWarning",
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore::ImportWarning",
    "ignore:.*PyparsingDeprecationWarning.*",
    "ignore:.*non-supported Python version.*:FutureWarning",
]

[tool.interrogate]
ignore-init-method = false
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-nested-classes = true
ignore-nested-functions = true
fail-under = 100
verbose = 2
color = false
