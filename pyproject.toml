[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "gemma-4-sql"
version = "0.0.1"
description = "Natural text to SQL with Gemma 4; with DuckDB support and swappable-backends: PyTorch; Keras ; JAX; JAX / MaxText "
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["dependencies", "optional-dependencies"]

[project.scripts]
gemma-4-sql = "gemma_4_sql.cli:cli"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.metadata.hooks.requirements_txt.optional-dependencies]
dev = ["requirements-dev.txt"]
jax = ["requirements-jax.txt"]
keras = ["requirements-keras.txt"]
maxtext = ["requirements-maxtext.txt"]
pytorch = ["requirements-pytorch.txt"]
duckdb = ["requirements-duckdb.txt"]
all = ["requirements-jax.txt", "requirements-keras.txt", "requirements-maxtext.txt", "requirements-pytorch.txt", "requirements-duckdb.txt"]
default = ["requirements-jax.txt", "requirements-keras.txt", "requirements-maxtext.txt", "requirements-pytorch.txt", "requirements-duckdb.txt"]

[tool.ruff]
line-length = 320
target-version = "py312"
extend-exclude = ["venv_*"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["ANN101", "ANN102", "UP040", "PLC0415", "PLR0912", "PLR0915", "N817", "D203", "D213", "COM812", "ISC001", "TRY401", "C901", "BLE001", "ERA001", "PLR2004", "FBT001", "FBT002", "UP007", "D417", "SIM108", "ARG001", "B905"]
extend-safe-fixes = ["ALL"]

[tool.ruff.lint.pylint]
max-args = 15

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.isort]
known-first-party = ["gemma_4_sql"]

[tool.mypy]
python_version = "3.12"
ignore_errors = true
ignore_missing_imports = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:"
]

[project.entry-points."gemma_4_sql.backends"]
jax = "gemma_4_sql.backends.jax"
keras = "gemma_4_sql.backends.keras"
maxtext = "gemma_4_sql.backends.maxtext"
pytorch = "gemma_4_sql.backends.pytorch"
mlx = "gemma_4_sql.backends.mlx"


[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "ARG", "ANN", "S101", "PLR2004", "PT011", "PLC0415", "RUF012", "F841", "ERA001", "BLE001", "PTH118", "TRY401", "SLF001", "PTH123", "PT018", "PTH112", "S110", "S608", "SIM105", "N", "F821"]
