[tox]
requires = tox>=4.20, tox-uv>=1.11
envlist = core, pytorch, jax, keras, maxtext, mlx, coverage-report
isolated_build = true
venv_redirect = false

[testenv]
runner = uv-venv-lock-runner
setenv =
    COVERAGE_FILE = {toxworkdir}/.coverage.{envname}
    KERAS_BACKEND = torch
commands =
    pytest --cov=src/gemma_4_sql --cov=tests --cov-branch --cov-report= --cov-fail-under=0 {posargs}

[testenv:core]
extras = dev,duckdb
commands =
    pytest --cov=src/gemma_4_sql --cov=tests --cov-branch --cov-report= --cov-fail-under=0 tests/core/ tests/sdk/ tests/cli/ tests/utils/ tests/backends/test_adapters.py tests/backends/test_backends.py tests/backends/test_backend_methods_edge_cases.py tests/backends/test_common.py tests/backends/test_common_benchmark.py tests/backends/test_common_data.py tests/backends/test_common_dpo.py tests/backends/test_common_logging.py tests/backends/test_common_multimodal.py tests/backends/test_common_quantize.py tests/backends/test_common_serve_batching.py tests/backends/test_common_train.py tests/backends/test_lazy_loader.py tests/backends/test_true_missing_backends.py

[testenv:pytorch]
extras = dev,pytorch
commands =
    pytest --cov=src/gemma_4_sql/backends/pytorch --cov=tests/backends/pytorch --cov=tests/conftest --cov-branch --cov-report= --cov-fail-under=0 tests/backends/pytorch/

[testenv:jax]
extras = dev,jax
commands =
    pytest --cov=src/gemma_4_sql/backends/jax --cov=tests/backends/jax --cov=tests/conftest --cov-branch --cov-report= --cov-fail-under=0 tests/backends/jax/

[testenv:keras]
extras = dev,keras
commands =
    pytest --cov=src/gemma_4_sql/backends/keras --cov=tests/backends/keras --cov-branch --cov-report= --cov-fail-under=0 tests/backends/keras/

[testenv:maxtext]
extras = dev,maxtext
commands =
    pytest --cov=src/gemma_4_sql/backends/maxtext --cov=tests/backends/maxtext --cov-branch --cov-report= --cov-fail-under=0 tests/backends/maxtext/

[testenv:mlx]
platform = darwin
extras = dev,mlx
commands =
    pytest --cov=src/gemma_4_sql/backends/mlx --cov=tests/backends/mlx --cov-branch --cov-report= --cov-fail-under=0 tests/backends/mlx/

[testenv:coverage-report]
depends = core, pytorch, jax, keras, maxtext, mlx
runner = uv-venv-runner
skip_install = true
deps = coverage[toml]
setenv =
    COVERAGE_FILE = {toxworkdir}/.coverage
commands =
    coverage combine --keep {toxworkdir}
    coverage report --keep-combined --show-missing --fail-under=100
    coverage xml --keep-combined -o {toxinidir}/coverage.xml
    coverage html --keep-combined -d {toxinidir}/htmlcov
