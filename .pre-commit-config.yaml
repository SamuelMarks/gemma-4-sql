repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        additional_dependencies: [pytest, click]
  - repo: local
    hooks:
      - id: tests
        name: Run tests
        entry: bash -c "uv run --all-extras pytest"
        language: system
        pass_filenames: false
        always_run: true
      - id: badges
        name: Update badges
        entry: bash -c "uv run --all-extras --with interrogate python scripts/update_badges.py"
        language: system
        pass_filenames: false
        always_run: true
