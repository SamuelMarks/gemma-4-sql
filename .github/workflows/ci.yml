name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install dependencies
        run: uv sync --extra dev --extra duckdb --extra jax --extra keras --extra maxtext --extra pytorch
      - name: Run Ruff lint check
        run: uv run --no-sync ruff check src tests scripts
      - name: Run Ruff format check
        run: uv run --no-sync ruff format --check src tests scripts
      - name: Check 100% docstring coverage
        run: uv run --no-sync interrogate -v src/gemma_4_sql tests scripts --fail-under=100
      - name: Run strict Pyright type checking
        run: uv run --no-sync pyright
      - name: Run ty type checking
        run: uv run --no-sync ty check

  tox-matrix:
    strategy:
      matrix:
        include:
          - env: core
            os: ubuntu-latest
          - env: pytorch
            os: ubuntu-latest
          - env: jax
            os: ubuntu-latest
          - env: keras
            os: ubuntu-latest
          - env: maxtext
            os: ubuntu-latest
          - env: mlx
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Run tests
        run: uvx --with tox-uv tox run -e ${{ matrix.env }}
      - name: Upload coverage slice
        uses: actions/upload-artifact@v4
        with:
          name: coverage-slice-${{ matrix.env }}
          path: .tox/.coverage.${{ matrix.env }}
          include-hidden-files: true
          if-no-files-found: error

  tox-coverage-aggregate:
    needs: [lint-and-typecheck, tox-matrix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download coverage slices
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-slice-*
          path: .tox/
          merge-multiple: true
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Aggregate coverage
        run: uvx --with tox-uv tox run -e coverage-report
