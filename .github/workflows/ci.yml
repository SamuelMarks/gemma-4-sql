name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tox-matrix:
    strategy:
      matrix:
        include:
          - env: core
            os: ubuntu-latest
          - env: pytorch
            os: ubuntu-latest
          - env: jax
            os: ubuntu-latest
          - env: keras
            os: ubuntu-latest
          - env: maxtext
            os: ubuntu-latest
          - env: mlx
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Run tests
        run: uvx --with tox-uv tox run -e ${{ matrix.env }}
      - name: Upload coverage slice
        uses: actions/upload-artifact@v4
        with:
          name: coverage-slice-${{ matrix.env }}
          path: .tox/.coverage.${{ matrix.env }}

  tox-coverage-aggregate:
    needs: [tox-matrix]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download coverage slices
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-slice-*
          path: .tox/
          merge-multiple: true
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Aggregate coverage
        run: uvx --with tox-uv tox run -e coverage-report
