name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Run tests
        run: |
          pytest --cov=src/gemma_4_sql --cov-report=xml --cov-report=term tests/

  test-gpu:
    runs-on: ubuntu-latest
    # This would typically run on a self-hosted GPU runner, but we use a mock tag here
    # runs-on: [self-hosted, gpu]
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install PyTorch & Keras GPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu121
          pip install keras tensorflow
      - name: Run GPU tests
        run: |
          pytest tests/backends/pytorch/ tests/backends/keras/

  test-tpu:
    runs-on: ubuntu-latest
    # This would typically run on a self-hosted TPU runner (e.g. GKE TPU node)
    # runs-on: [self-hosted, tpu]
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install JAX & MaxText TPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -U "jax[tpu]" -f https://storage.googleapis.com/jax-releases/libtpu_releases.html
      - name: Run TPU tests
        run: |
          pytest tests/backends/jax/ tests/backends/maxtext/
