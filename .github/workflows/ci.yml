name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  doc-coverage:
    name: 100% Documentation Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install interrogate pydocstyle
      - name: Check 100% doc coverage
        run: |
          interrogate -vv --fail-under=100 src/ tests/
          pydocstyle src/

  type-check:
    name: Strict Type Checking Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install mypy
      - name: Run strict type checking
        run: |
          mypy --strict src/

  test:
    name: 100% Test Branch Coverage Gate
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mlx]"
      - name: Run lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Run tests
        env:
          KERAS_BACKEND: torch
        run: |
          pytest --cov=src/gemma_4_sql --cov-branch --cov-report=xml --cov-report=term tests/core/ tests/sdk/ tests/cli/ src/
          pytest --cov=src/gemma_4_sql --cov-branch --cov-append --cov-report=xml --cov-report=term tests/backends/pytorch/ tests/backends/keras/
          pytest --cov=src/gemma_4_sql --cov-branch --cov-append --cov-report=xml --cov-report=term tests/backends/jax/ tests/backends/maxtext/
          pytest --cov=src/gemma_4_sql --cov-branch --cov-append --cov-fail-under=100 --cov-report=xml --cov-report=term tests/backends/mlx/ tests/backends/test_*.py

  test-gpu:
    runs-on: ubuntu-latest
    # This would typically run on a self-hosted GPU runner, but we use a mock tag here
    # runs-on: [self-hosted, gpu]
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install PyTorch & Keras GPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu121
          pip install keras tensorflow
      - name: Run GPU tests
        run: |
          pytest tests/backends/pytorch/
          pytest tests/backends/keras/

  test-tpu:
    runs-on: ubuntu-latest
    # This would typically run on a self-hosted TPU runner (e.g. GKE TPU node)
    # runs-on: [self-hosted, tpu]
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install JAX & MaxText TPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -U "jax[tpu]" -f https://storage.googleapis.com/jax-releases/libtpu_releases.html
      - name: Run TPU tests
        run: |
          pytest tests/backends/jax/
          pytest tests/backends/maxtext/
