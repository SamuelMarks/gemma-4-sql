repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        additional_dependencies: [pytest, click]
  - repo: local
    hooks:
      - id: tests-and-badges
        name: Run tests and update badges
        entry: bash -c "if command -v python3.12 >/dev/null 2>&1; then python3.12 scripts/update_badges.py; else python3 scripts/update_badges.py; fi"
        language: system
        pass_filenames: false
        always_run: true
