[build-system]
requires = [
    "hatchling",
    "hatch-requirements-txt",
]
build-backend = "hatchling.build"

[project]
name = "gemma-4-sql"
version = "0.0.1"
description = "Natural text to SQL with Gemma 4, with DuckDB support and swappable backends: PyTorch, Keras, JAX, MaxText, and MLX."
readme = "README.md"
license = "Apache-2.0 OR MIT"
requires-python = ">=3.12"
dynamic = [
    "dependencies",
    "optional-dependencies",
]

[project.scripts]
gemma-4-sql = "gemma_4_sql.cli:cli"

[project.entry-points."gemma_4_sql.backends"]
jax = "gemma_4_sql.backends.jax"
keras = "gemma_4_sql.backends.keras"
maxtext = "gemma_4_sql.backends.maxtext"
pytorch = "gemma_4_sql.backends.pytorch"
pytorch_hf = "gemma_4_sql.backends.pytorch"
pytorch_native = "gemma_4_sql.backends.pytorch"
mlx = "gemma_4_sql.backends.mlx"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.metadata.hooks.requirements_txt]
files = [
    "requirements.txt",
]

[tool.hatch.metadata.hooks.requirements_txt.optional-dependencies]
dev = [
    "requirements-dev.txt",
]
jax = [
    "requirements-jax.txt",
]
keras = [
    "requirements-keras.txt",
]
maxtext = [
    "requirements-maxtext.txt",
]
pytorch = [
    "requirements-pytorch.txt",
]
duckdb = [
    "requirements-duckdb.txt",
]
mlx = [
    "requirements-mlx.txt",
]
all = [
    "requirements-jax.txt",
    "requirements-keras.txt",
    "requirements-maxtext.txt",
    "requirements-pytorch.txt",
    "requirements-duckdb.txt",
    "requirements-mlx.txt",
]
default = [
    "requirements-jax.txt",
    "requirements-keras.txt",
    "requirements-maxtext.txt",
    "requirements-pytorch.txt",
    "requirements-duckdb.txt",
    "requirements-mlx.txt",
]

[tool.ruff]
unsafe-fixes = false
preview = true
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "D",
    "DOC",
    "UP",
    "ANN",
    "ASYNC",
    "S",
    "BLE",
    "B",
    "A",
    "C4",
    "DTZ",
    "T20",
    "PT",
    "RET",
    "SIM",
    "TID",
    "ARG",
    "PTH",
    "ERA",
    "PL",
    "TRY",
    "PERF",
    "FURB",
    "RUF",
]
extend-safe-fixes = [
    "ALL",
]
ignore = [
    "non-empty-init-module",
    "unused-unpacked-variable",
    "star-arg-unpacking-after-keyword-arg",
    "missing-trailing-comma",
    "single-line-implicit-string-concatenation",
    "too-many-statements",
    "too-many-locals",
    "too-many-branches",
    "too-many-arguments",
    "too-many-return-statements",
    "too-many-positional-arguments",
    "too-many-public-methods",
    "too-many-boolean-expressions",
    "magic-value-comparison",
    "non-augmented-assignment",
    "literal-membership",
    "no-self-use",
    "global-statement",
    "import-outside-top-level",
    "relative-imports",
    "raise-vanilla-args",
    "raise-within-try",
    "try-consider-else",
    "assert",
    "hardcoded-bind-all-interfaces",
    "hardcoded-password-default",
    "hardcoded-temp-file",
    "hardcoded-sql-expression",
    "suspicious-non-cryptographic-random-usage",
    "invalid-function-name",
    "invalid-class-name",
    "constant-imported-as-non-constant",
    "lowercase-imported-as-non-lowercase",
    "builtin-open",
    "builtin-argument-shadowing",
    "abstract-base-class-without-abstract-method",
    "unused-async",
    "falsy-dict-get-fallback",
    "non-pep604-annotation-union",
    "too-many-statements-in-try-clause",
    "float-equality-comparison",
    "set-attr-with-constant",
    "non-pep695-generic-class",
    "non-pep695-generic-function",
    "overload-with-docstring",
    "suppressible-exception",
    "docstring-extraneous-exception",
    "docstring-extraneous-returns",
]

[tool.ruff.lint.per-file-ignores]
"src/gemma_4_sql/cli*.py" = [
    "print",
]
"scripts/*" = [
    "print",
    "suspicious-subprocess-import",
    "subprocess-without-shell-equals-true",
    "start-process-with-partial-path",
]
"tests/**" = [
    "assert",
    "print",
    "module-import-not-at-top-of-file",
    "suspicious-subprocess-import",
    "subprocess-without-shell-equals-true",
    "start-process-with-partial-path",
    "async-busy-wait",
    "pytest-raises-with-multiple-statements",
    "no-self-use",
    "unused-function-argument",
    "unused-method-argument",
    "unused-class-method-argument",
    "unused-async",
    "pytest-composite-assertion",
    "compare-to-empty-string",
    "too-many-statements-in-try-clause",
    "import-outside-top-level",
    "import-private-name",
    "too-many-locals",
    "float-equality-comparison",
    "subclass-builtin",
    "multiple-with-statements",
    "mutable-class-default",
]
"src/**/tests/*" = [
    "assert",
    "no-self-use",
    "unused-function-argument",
    "unused-method-argument",
    "unused-class-method-argument",
    "unused-async",
    "pytest-composite-assertion",
    "compare-to-empty-string",
    "too-many-statements-in-try-clause",
    "import-outside-top-level",
    "import-private-name",
    "too-many-locals",
    "float-equality-comparison",
    "subclass-builtin",
    "multiple-with-statements",
    "mutable-class-default",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.isort]
known-first-party = [
    "gemma_4_sql",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "Do not use typing.Any; use explicit Protocols, TypedDicts, or TypeVars instead."
"typing.cast".msg = "Do not use typing.cast; use runtime-checkable Protocols or type guards instead."
"builtins.object".msg = "Do not annotate with builtins.object; use narrow Protocols, TypeVars, or Unions instead."
"builtins.getattr".msg = "Avoid dynamic attribute reflection (getattr); use explicit Protocols and typed attributes."
"builtins.setattr".msg = "Avoid dynamic attribute mutation (setattr); use explicit typed attributes or constructors."
"builtins.hasattr".msg = "Avoid hasattr; use narrow runtime-checkable Protocols with isinstance()."
"builtins.delattr".msg = "Avoid delattr; use explicit typed state transitions."
"builtins.__import__".msg = "Do not use __import__; use LazyLoader / optional_import / import_optional_symbol or standard imports instead."
"unittest.mock.MagicMock".msg = "Do not use untyped mocks (which erase types to Any); use explicit typed test doubles implementing Protocols."
"unittest.mock.AsyncMock".msg = "Do not use untyped mocks (which erase types to Any); use explicit typed test doubles implementing Protocols."
"unittest.mock.Mock".msg = "Do not use untyped mocks (which erase types to Any); use explicit typed test doubles implementing Protocols."
"unittest.mock.NonCallableMagicMock".msg = "Do not use untyped mocks (which erase types to Any); use explicit typed test doubles implementing Protocols."
"types.SimpleNamespace".msg = "Do not use SimpleNamespace (which erases types to Any); use explicit typed classes or dataclasses."
"types.ModuleType".msg = "Do not use types.ModuleType (which erases member types to Any); use ModuleNamespaceProtocol or explicit module Protocols."
"numpy".msg = "Do not use numpy directly; use the backend-specific library (jax.numpy, torch, keras.ops, mlx.core) instead."

[tool.mypy]
python_version = "3.12"
ignore_errors = false
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
allow_redefinition = true
disallow_any_generics = true
disallow_subclassing_any = false
disallow_untyped_decorators = false
warn_return_any = true

[tool.coverage.run]
relative_files = true

[tool.coverage.paths]
source = [
    "src/gemma_4_sql",
    "*/src/gemma_4_sql",
]

[tool.coverage.report]
exclude_lines = [
    "^\\s*\\.\\.\\.\\s*$",
]
partial_branches = [
    "(?!)",
]
partial_branches_always = [
    "(?!)",
]

[tool.pytest.ini_options]
addopts = "--cov-report=term-missing --cov-fail-under=100 --cov-branch"
markers = [
    "torch: Tests requiring PyTorch (torch, torchvision, torchaudio)",
    "jax: Tests requiring JAX and Flax (jax, jaxlib, flax)",
    "keras: Tests requiring Keras and TensorFlow (keras, tensorflow)",
    "maxtext: Tests requiring MaxText Gemma 4 dependencies",
    "mlx: Tests requiring Apple Silicon MLX (mlx, mlx_lm)",
    "duckdb: Tests requiring native DuckDB engine",
]
filterwarnings = [
    "ignore::FutureWarning",
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore::ImportWarning",
    "ignore:.*PyparsingDeprecationWarning.*",
    "ignore:.*non-supported Python version.*:FutureWarning",
]

[tool.interrogate]
ignore-init-method = false
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-nested-classes = false
ignore-nested-functions = false
fail-under = 100
verbose = 2
color = false

[tool.ty.environment]
python = ".venv"

[tool.ty.rules]
unresolved-import = "ignore"
invalid-mutable-override = "error"

[[tool.ty.overrides]]
include = [
    "src/gemma_4_sql/backends/pytorch/gemma4/**",
    "src/gemma_4_sql/backends/pytorch/peft.py",
    "tests/backends/pytorch/**",
]
rules.invalid-mutable-override = "ignore"
