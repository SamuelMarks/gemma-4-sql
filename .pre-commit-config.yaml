repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format
  - repo: local
    hooks:
      - id: interrogate
        name: Check 100% docstring coverage
        entry: bash -c "uv run --extra dev interrogate -q src tests scripts"
        language: system
        pass_filenames: false
        always_run: true
      - id: mypy
        name: Run strict mypy type checking
        entry: bash -c "uv run --extra dev mypy src tests scripts"
        language: system
        pass_filenames: false
        always_run: true
      - id: tests-multi-env
        name: Run multi-env tests & aggregated coverage
        entry: bash -c "if [ -f .tox/.coverage.core ] && [ -f .tox/.coverage.pytorch ] && [ -f .tox/.coverage.jax ] && [ -f .tox/.coverage.keras ] && [ -f .tox/.coverage.maxtext ] && [ -f .tox/.coverage.mlx ] && [ -z \"$(find src tests -name '*.py' -newer .tox/.coverage.core 2>/dev/null)\" ]; then uvx --with tox-uv tox run --skip-pkg-install -e coverage-report; else uvx --with tox-uv tox run-parallel --skip-pkg-install -e core,pytorch,jax,keras,maxtext,mlx && uvx --with tox-uv tox run --skip-pkg-install -e coverage-report; fi"
        language: system
        pass_filenames: false
        always_run: true
      - id: update-badges
        name: Update doc and test coverage badges
        entry: bash -c "uv run --extra dev python scripts/update_badges.py"
        language: system
        pass_filenames: false
        always_run: true
